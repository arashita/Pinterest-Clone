{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'posts:post_list' %}">📌 View Posts</a>
    </header>

    <main>
        <h2>Create a New Post</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label for="{{ form.title.id_for_label }}">Title</label>
                {{ form.title }}  <!-- Title field -->
            </div>
            <div>
                <label for="{{ form.description.id_for_label }}">Description</label>
                {{ form.description }}  <!-- Description field -->
            </div>
            <div>
                <label for="{{ form.media.id_for_label }}">Media</label>
                {{ form.media }}  <!-- Media field -->
            </div>
            <div>
                <label for="{{ form.board.id_for_label }}">Board</label>
                {{ form.board }}  <!-- Board selection dropdown -->
            </div>
            <button type="submit">Post</button>
        </form>
    </main>
</body>
</html>
