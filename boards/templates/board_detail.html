{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ board.name }}</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'boards:board_list' %}">📌 All Boards</a>
    </header>

    <main>
        <h2>{{ board.name }}</h2>
        <p>{{ board.description }}</p>

        <h3>Posts in this Board</h3>
        <div class="post-container">
            {% for post in posts %}
                <div class="post">
                    <img src="{{ post.media.url }}" alt="{{ post.title }}" width="200">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.description }}</p>
                </div>
            {% empty %}
                <p>No posts in this board yet.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
