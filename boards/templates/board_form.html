{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Board</title>
    <link rel="stylesheet" href="{% static 'board_form.css' %}">
</head>
<body>
    <header>
        <div class="left-section">
            <!-- Pinterest Logo -->

                </svg>
            </a>
            <!-- Create Post Button -->
            <a href="{% url 'posts:create_post' %}" class="nav-link create-btn">Create Post</a>
        </div>
    </header>

    <main>
        <h2 style="text-align: center;">Create a New Board</h2>
        <form method="POST" class="board-form">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Render the form -->
            <button type="submit" class="btn create-board-btn">Create Board</button>
        </form>
    </main>
</body>
</html>
