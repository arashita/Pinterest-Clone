{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Boards</title>
    <link rel="stylesheet" href="{% static 'board_list.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="left-section">
            <a href="{% url 'home' %}" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 5.69373 17.3488 C 5.58145 16.327 5.66114 15.3484 5.8857 14.4022 L 6.7912 10.5237 C 6.6427 10.0524 6.53042 9.51268 6.53042 8.97302 C 6.53042 7.71376 7.14253 6.81431 8.10236 6.81431 C 8.76878 6.81431 9.25776 7.27483 9.25776 8.16349 C 9.25776 8.44414 9.1998 8.76074 9.08752 9.12053 L 8.69274 10.4121 C 8.61305 10.6604 8.58046 10.8943 8.58046 11.0993 C 8.58046 11.9988 9.27225 12.5061 10.1524 12.5061 C 11.7243 12.5061 12.8471 10.8871 12.8471 8.78593 C 12.8471 6.44733 11.3078 4.95063 9.0332 4.95063 C 6.49781 4.95063 4.88966 6.59124 4.88966 8.87587 C 4.88966 9.79693 5.17218 10.6532 5.72635 11.236 C 5.54524 11.5383 5.35327 11.5958 5.0599 11.5958 C 4.15441 11.5958 3.29237 10.3258 3.29237 8.59525 C 3.29237 5.60545 5.7046 3.22007 9.08752 3.22007 C 12.6407 3.22007 14.8718 5.681 14.8718 8.71758 C 14.8718 11.7757 12.6986 14.0712 10.3552 14.0712 C 9.42799 14.0712 8.61305 13.679 8.0444 12.9702 L 7.58079 14.8375 C 7.33088 15.8053 6.9578 16.7156 6.35656 17.5934 C 7.20411 17.8525 8.0444 18 9.05131 18 C 14.0532 18 18.1062 13.974 18.1062 9.0054 C 18.1062 4.03677 14.0569 0 9.05493 0 C 4.05299 0 0 4.02599 0 8.9946 C 0 12.7616 2.33256 16.0104 5.69373 17.3488 Z" fill="rgb(230, 0, 35)" />
                </svg>
            </a>
            <a href="{% url 'posts:create_post' %}" class="nav-link create-btn">+ Create Pin</a>
        </div>
    </header>

    <main>
        <h2 style="text-align: center;">My Boards</h2>
        <div style="text-align: center;">
            <p><a href="{% url 'boards:board_create' %}" class="create-board-btn">Create a new board</a></p>
        </div>

        <div class="boards-container">
            {% for board in boards %}
                <div class="board-card">
                    <h3>{{ board.name }}</h3>
                    <p>{{ board.description }}</p>
                    <div class="board-actions">
                        <a href="{% url 'boards:board_detail' board.id %}" class="btn view-btn"><i class="fas fa-eye"></i></a>
                        <button class="btn edit-btn edit-board-btn"
                            data-board-id="{{ board.id }}"
                            data-board-name="{{ board.name }}"
                            data-board-description="{{ board.description }}"
                            data-edit-url="{% url 'boards:board_update' board.id %}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <form method="POST" action="{% url 'boards:board_delete' board.id %}">
                            {% csrf_token %}
                            <button type="submit" class="btn delete-btn"><i class="fas fa-trash"></i></button>
                        </form>
                    </div>
                </div>
            {% empty %}
                <p>You haven't created any boards yet.</p>
            {% endfor %}
        </div>
    </main>

    <div id="edit-board-form-container" style="display: none; text-align: center; margin-top: 20px;">
        <form id="edit-board-form" method="POST">
            {% csrf_token %}
            <input type="text" id="edit-board-name" name="name" placeholder="Board Name" required>
            <textarea id="edit-board-description" name="description" placeholder="Board Description"></textarea>
            <button type="submit" class="btn save-btn">Update Board</button>
            <button type="button" class="btn cancel-btn" id="cancel-edit-btn">Cancel</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const editButtons = document.querySelectorAll(".edit-board-btn");
            const editFormContainer = document.getElementById("edit-board-form-container");
            const editForm = document.getElementById("edit-board-form");
            const nameInput = document.getElementById("edit-board-name");
            const descriptionInput = document.getElementById("edit-board-description");
            const cancelEditBtn = document.getElementById("cancel-edit-btn");
        
            let editUrl = ""; 
        
            editButtons.forEach(button => {
                button.addEventListener("click", function () {
                    editUrl = this.getAttribute("data-edit-url");  // ✅ Fetch the correct edit URL dynamically
                    const boardName = this.getAttribute("data-board-name");
                    const boardDescription = this.getAttribute("data-board-description");
        
                    nameInput.value = boardName;
                    descriptionInput.value = boardDescription;
                    editFormContainer.style.display = "block";
                });
            });
        
            cancelEditBtn.addEventListener("click", function () {
                editFormContainer.style.display = "none";
            });
        
            editForm.addEventListener("submit", async function (event) {
                event.preventDefault();
        
                const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
                const requestBody = `name=${encodeURIComponent(nameInput.value)}&description=${encodeURIComponent(descriptionInput.value)}`;
        
                try {
                    const response = await fetch(editUrl, {  // ✅ Uses the dynamically generated edit URL
                        method: "POST",
                        headers: {
                            "X-CSRFToken": csrfToken,
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: requestBody
                    });
        
                    const data = await response.json();
        
                    if (data.success) {
                        alert("Board updated successfully!");
        
                        const boardCard = document.querySelector(`[data-board-id="${data.board_id}"]`).closest(".board-card");
                        boardCard.querySelector("h3").textContent = data.board_name;
                        boardCard.querySelector("p").textContent = data.board_description;
        
                        editFormContainer.style.display = "none";
                    } else {
                        alert("Failed to update board: " + JSON.stringify(data.error));
                    }
                } catch (error) {
                    console.error("Error:", error);
                }
            });
        });
        
    </script>
</body>
</html>
